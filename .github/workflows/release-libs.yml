name: Release multi-arch moxygen libs image

# Publishes a pre-built moxygen build-artifact image to GHCR so that
# downstream consumers (notably JBS and Jeket-com/nmos-cpp) don't have to
# rebuild folly + the Meta dependency stack on every commit.
#
# The image is heavy on purpose: it contains the installed prefix
# (/opt/moxygen) AND the uninstalled object files (/opt/moxygen-build/
# build/moxygen) AND the source tree (/opt/moxygen-src). Downstreams need
# all three:
#   - /opt/moxygen          → cmake configs for folly/fizz/mvfst/proxygen/wangle
#   - /opt/moxygen-build/*  → libmoxygen*.a object files (not installed
#                             by getdeps.py but linked by JBS C++ services)
#   - /opt/moxygen-src      → source headers (#include moxygen/...)
#
# Runners: this fork is PUBLIC, so the build runs on GitHub-hosted runners
# (free for public repos, native arm64 via ubuntu-24.04-arm). Org
# self-hosted runners are deliberately NOT used here — runner groups stay
# closed to public repositories, so no external code can ever land on
# Jeket infrastructure through this repo. Triggers are tag-push and manual
# dispatch only (maintainers), never pull_request.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/jeket-com/moxygen-libs

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Free up disk space
        # getdeps builds the whole folly stack; the hosted-runner image ships
        # ~30GB of preinstalled toolchains we don't need.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push single-arch image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --file docker/Dockerfile.libs \
            --tag ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }} \
            --push \
            .

  fuse:
    name: Fuse multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }} \
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-amd64 \
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}-arm64

      - name: Verify multi-arch index
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
